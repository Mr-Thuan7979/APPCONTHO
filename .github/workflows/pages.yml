# Đưa app lên GitHub Pages mỗi khi nhánh mặc định có thay đổi.
name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Kiểm tra bộ câu hỏi
        run: npm test

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Gom file ứng dụng
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons audio _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
